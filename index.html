<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KGOTSO DIARY</title>
<style>
:root{--green:#0a4d2b;--gold:#c9a44a}
body{margin:0;font-family:Arial;background:#0f2a1f}
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.cover{background:#fff;color:#111}
.logo-big{width:100%;max-width:360px;border-radius:22px;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.btn{background:linear-gradient(90deg,var(--green),var(--gold));color:#fff;padding:14px 30px;border:none;border-radius:12px;font-weight:bold;font-size:16px;margin-top:20px}
.card{background:#153d27;border:2px solid var(--gold);padding:18px;border-radius:18px;margin:15px}
input,textarea,select{width:100%;padding:13px;margin:7px 0;border-radius:12px;border:none;box-sizing:border-box}
.entry{background:#fff;color:#111;padding:14px;border-radius:14px;margin:12px 15px;border-left:6px solid var(--gold)}
.top{background:#0a3d22;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold)}
</style>
</head>
<body>

<div id="cover" class="screen cover">
<img src="logo.png" class="logo-big">
<p style="color:var(--green);font-weight:bold;letter-spacing:2px;margin-top:15px">PRIVATE • PROPHETIC • SPIRITUAL</p>
<button class="btn" onclick="cover.style.display='none';lock.style.display='flex'">OPEN DIARY 📖</button>
</div>

<div id="lock" class="screen" style="display:none;background:radial-gradient(circle at top,#1a5a35,#0f2a1f);color:#fff">
<img src="logo.png" style="width:110px;border-radius:16px;border:3px solid var(--gold)">
<h2 style="color:var(--gold)">KGOTSO DIARY</h2>
<input type="password" id="pin" placeholder="PIN: 1234" style="max-width:220px;text-align:center">
<button class="btn" onclick="if(pin.value=='1234'){lock.style.display='none';main.style.display='block';load()}else alert('Wrong PIN')" style="max-width:220px">UNLOCK 🙏</button>
<button class="btn" style="background:#333;margin-top:10px;max-width:220px" onclick="lock.style.display='none';cover.style.display='flex'">BACK TO COVER</button>
</div>

<div id="main" style="display:none">
<div class="top"><div style="display:flex;gap:10px;align-items:center"><img src="logo.png" style="width:44px;border-radius:10px"><div><b style="color:var(--gold)">KGOTSO</b><br><small>Spiritual Diary</small></div></div><span id="count" style="background:var(--gold);color:#000;padding:5px 10px;border-radius:20px;font-size:12px">0</span></div>
<div class="card"><input type="date" id="dDate"><input type="text" id="dFor" placeholder="For: Name"><textarea id="dText" rows="4" placeholder="Write prophecy..."></textarea><select id="dType"><option>Prophecy</option><option>Vision</option><option>Dream</option><option>Prayer</option></select><select id="dStatus"><option>Waiting</option><option>Fulfilled</option><option>Urgent</option></select><button class="btn" onclick="save()">SAVE ✨</button></div>
<div style="padding:0 15px"><input type="text" id="search" placeholder="🔍 Search..." onkeyup="load()"></div><div id="list"></div>
<div style="padding:20px"><button class="btn" style="background:#333" onclick="location.reload()">LOCK 🔒</button></div>
</div>

<script>
let entries=JSON.parse(localStorage.getItem('kgotso_final_v2')||'[]');
function save(){const e={date:dDate.value||new Date().toISOString().split('T')[0],for:dFor.value,text:dText.value,type:dType.value,status:dStatus.value,time:new Date().toLocaleString()};if(!e.text.trim())return alert('Write first');entries.unshift(e);localStorage.setItem('kgotso_final_v2',JSON.stringify(entries));dText.value='';dFor.value='';load()}
function load(){const q=search.value.toLowerCase();const f=entries.filter(e=>(e.text+e.for).toLowerCase().includes(q));count.textContent=f.length;list.innerHTML=f.map((e,i)=>`<div class="entry"><small>${e.date} • ${e.type} • ${e.status}</small><br><b>For: ${e.for||'Self'}</b><p style="white-space:pre-wrap">${e.text}</p><small style="color:#666">${e.time}</small><small style="color:red;float:right;cursor:pointer" onclick="if(confirm('Delete?')){entries.splice(${i},1);localStorage.setItem('kgotso_final_v2',JSON.stringify(entries));load()}">Delete</small></div>`).join('')||'<p style="text-align:center;color:#888;padding:30px">No entries yet 🙏</p>'}
dDate.valueAsDate=new Date();
</script>
</body>
</html>
